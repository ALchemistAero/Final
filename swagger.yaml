openapi: 3.0.0

info:
  title: Task Management API
  version: 1.0.0
  description: API for managing users, projects, tasks, and comments

servers:
  - url: https://final-77ir.onrender.com
    description: Production server
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Auth
  - name: Users
  - name: Projects
  - name: Tasks
  - name: Comments

paths:
  /api/auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: John Doe
              email: john@example.com
              password: Password123!
              role: USER
      responses:
        201:
          description: User created
        400:
          description: Invalid request body
        409:
          description: Email already exists

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: john@example.com
              password: Password123!
      responses:
        200:
          description: JWT token returned
        400:
          description: Missing email or password
        401:
          description: Invalid credentials

  /api/users:
    get:
      tags: [Users]
      summary: Get all users (Admin only)
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of users
        401:
          description: Unauthorized
        403:
          description: Forbidden

    post:
      tags: [Users]
      summary: Create user (Admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Jane Doe
              email: jane@example.com
              password: Password123!
              role: USER
      responses:
        201:
          description: User created
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        409:
          description: Email already exists

  /api/users/{id}:
    get:
      tags: [Users]
      summary: Get user by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: User found
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: User not found

    put:
      tags: [Users]
      summary: Update user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Updated Name
              email: updated@example.com
              role: USER
      responses:
        200:
          description: User updated
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: User not found

    delete:
      tags: [Users]
      summary: Delete user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: User deleted
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: User not found

  /api/projects:
    get:
      tags: [Projects]
      summary: Get projects
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of projects
        401:
          description: Unauthorized

    post:
      tags: [Projects]
      summary: Create project
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: My Project
              description: Project description
              status: ACTIVE
      responses:
        201:
          description: Project created
        400:
          description: Invalid request body
        401:
          description: Unauthorized

  /api/projects/{id}:
    get:
      tags: [Projects]
      summary: Get project by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Project found
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Project not found

    put:
      tags: [Projects]
      summary: Update project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Updated Project
              description: Updated description
              status: ACTIVE
      responses:
        200:
          description: Project updated
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Project not found

    delete:
      tags: [Projects]
      summary: Delete project
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Project deleted
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Project not found

  /api/tasks:
    get:
      tags: [Tasks]
      summary: Get tasks
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of tasks
        401:
          description: Unauthorized

    post:
      tags: [Tasks]
      summary: Create task
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Task title
              description: Task description
              status: TODO
              project_id: 1
      responses:
        201:
          description: Task created
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Project not found

  /api/tasks/{id}:
    get:
      tags: [Tasks]
      summary: Get task by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Task found
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Task not found

    put:
      tags: [Tasks]
      summary: Update task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Updated Task
              description: Updated task description
              status: DONE
              project_id: 1
      responses:
        200:
          description: Task updated
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Task not found

    delete:
      tags: [Tasks]
      summary: Delete task
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Task deleted
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Task not found

  /api/comments:
    get:
      tags: [Comments]
      summary: Get comments
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of comments
        401:
          description: Unauthorized

    post:
      tags: [Comments]
      summary: Create comment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              body: This is a comment
              task_id: 1
      responses:
        201:
          description: Comment created
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Task not found

  /api/comments/{id}:
    get:
      tags: [Comments]
      summary: Get comment by ID
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Comment found
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Comment not found

    put:
      tags: [Comments]
      summary: Update comment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              body: Updated comment
              task_id: 1
      responses:
        200:
          description: Comment updated
        400:
          description: Invalid request body
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Comment not found

    delete:
      tags: [Comments]
      summary: Delete comment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        200:
          description: Comment deleted
        401:
          description: Unauthorized
        403:
          description: Forbidden
        404:
          description: Comment not found